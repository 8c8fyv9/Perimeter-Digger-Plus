name: CI

on:
  push:
  pull_request:

jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source-contract & agent client tests
        run: node --test agent/client.test.mjs
